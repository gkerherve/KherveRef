name: Windows build

# The same one-shot script used on a Windows desktop
# (packaging/build_installer.py): stamp VERSION, freeze with PyInstaller,
# zip, compile the Inno Setup installer. Lets a release be cut from a Mac:
# run this and macos-build.yml on the same commit so both platforms carry
# the same <major>.<minor>.<n>.
#
# This workflow only BUILDS. It uploads the installer, the portable zip and
# the stable-name copy as a workflow artifact and never creates a release:
# the v<ver> release becomes `releases/latest`, which the website's download
# button points at, so it is created by hand after the build is checked.
#
# Development happens on `dev`, not on the default branch, and GitHub only
# lists workflow_dispatch workflows that exist on the default branch — so
# the trigger is a tag push, which runs the workflow file of the tagged
# commit wherever it lives. The tag is also the release tag later:
#
#   git tag v0.24.N && git push origin v0.24.N
#
# (`v*` does not match `macos-v*`: tag patterns are anchored at the start.)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45    # a hung test must not hold a runner for 6 hours

    steps:
      - uses: actions/checkout@v4
        with:
          # The version is `git rev-list --count HEAD`, so a shallow
          # clone would silently ship the wrong build number.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pytest
          python -c "import PySide6, pymupdf, pygit2; print('PySide6', PySide6.__version__)"

      - name: Install Inno Setup
        # Not guaranteed on the runner image; choco is. build_installer.py
        # finds it under Program Files (x86).
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build the installer and portable zip
        run: python packaging/build_installer.py

      - name: Read the version back
        shell: bash
        run: |
          VERSION=$(python packaging/build_info.py | cut -d' ' -f2 | cut -d+ -f1 | tr -d '\r\n')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the build
        # No launch from the installer (it would need a desktop). Checks
        # what a freeze breaks: a version without the commit count, a
        # missing exe, the citation styles.
        shell: bash
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test -f dist/KherveRef/KherveRef.exe
          find dist/KherveRef -path '*kherveref/BUILD' | grep -q .
          find dist/KherveRef -path '*kherveref/styles*' | grep -q .
          ls -lh dist/KherveRef-Setup-$VERSION.exe dist/KherveRef-$VERSION-portable.zip \
                 dist/KherveRef-Setup.exe

      - name: Smoke-test the frozen app
        # Run the real executable offscreen: --version, its --smoke-test
        # (window, PDF import, BibTeX, Git, citation styles) and an MCP
        # handshake. A missing hidden import only shows when its code runs.
        shell: bash
        run: python packaging/smoke_test.py dist/KherveRef/KherveRef.exe --version "$VERSION"

      - name: Install silently, smoke-test the installed app, uninstall
        # The only place the installer itself is ever run: compiling it proves
        # the script parses, not that it installs. Per-user, so no elevation
        # is needed on the runner. Checks the files land, the .kref
        # association is written, the INSTALLED exe works (same smoke test),
        # and the uninstaller removes it again.
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "KherveRef-installed"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process -FilePath "dist\KherveRef-Setup-$env:VERSION.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$log" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$dir\KherveRef.exe")) { Get-Content $log -Tail 40; throw "KherveRef.exe was not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\.kref")) { throw ".kref association was not written" }
          python packaging/smoke_test.py "$dir\KherveRef.exe" --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "smoke test of the installed app failed" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # Inno's uninstaller re-launches itself from %TEMP% and returns at once.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\KherveRef.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\KherveRef.exe") { throw "the uninstaller did not remove the app" }
          if (Test-Path "HKCU:\Software\Classes\.kref") { throw "the uninstaller left the .kref association" }
          Write-Host "install / run / uninstall OK"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: KherveRef-${{ env.VERSION }}-windows
          path: |
            dist/KherveRef-Setup-*.exe
            dist/KherveRef-Setup.exe
            dist/KherveRef-*-portable.zip
          if-no-files-found: error
