name: Build installers

# Windows installer (Inno Setup) and macOS DMGs (arm64 + x86_64), each
# smoke-tested after the build. Uploaded as workflow artifacts; no
# GitHub release is created. Trigger:
#
#   git tag v<__version__> && git push origin v<__version__>

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build
        run: |
          python packaging/generate_icon.py
          pyinstaller KherveRef.spec --noconfirm
      - name: Smoke test the build
        run: python packaging/smoke_test.py dist/KherveRef/KherveRef.exe
      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path kherveref/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" KherveRef_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: KherveRef-windows
          path: installer/*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Build
        run: |
          python packaging/generate_icon.py
          pyinstaller KherveRef.spec --noconfirm
          codesign --force --deep --sign - dist/KherveRef.app
      - name: Smoke test the build
        run: python packaging/smoke_test.py dist/KherveRef.app/Contents/MacOS/KherveRef
      - name: DMG
        run: |
          v=$(python -c "import kherveref; print(kherveref.__version__)")
          mkdir dmg && cp -R dist/KherveRef.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "KherveRef $v" -srcfolder dmg -ov -format UDZO \
            "KherveRef-$v-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: KherveRef-macos-${{ matrix.arch }}
          path: "*.dmg"
