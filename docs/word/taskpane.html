<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KherveRef</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header>
    <strong>KherveRef</strong>
    <span id="library" class="muted"></span>
  </header>

  <div id="offline" class="notice" hidden>
    <b>KherveRef isn't running.</b> Open KherveRef on this computer, then
    <button id="retry" class="link">try again</button>.
  </div>

  <main id="main" hidden>
    <input id="search" type="search" title="Type an author, title word, year or citation key to find a reference" placeholder="Search your library…" autocomplete="off">
    <ul id="results" aria-label="References"></ul>
    <div class="row">
      <button id="cite" class="primary" disabled title="Click in your text first, select one or more references above, then click here to insert the citation">Insert citation</button>
      <span id="selected" class="muted"></span>
    </div>

    <section>
      <label for="style">Citation style</label>
      <select id="style" title="The citation style of this document. Changing it restyles every citation and the bibliography"></select>
      <div class="row">
        <button id="bibliography" title="The reference list is added at the end of the document with your first citation. To put it somewhere else, click there, then here: it moves, with its heading.">Insert bibliography</button>
        <button id="refresh" title="Renumber and reformat every citation and the bibliography, e.g. after moving text or changing style">Refresh all</button>
      </div>
      <p id="status" class="muted" role="status"></p>
    </section>
  </main>
  <script src="taskpane.js"></script>
</body>
</html>
